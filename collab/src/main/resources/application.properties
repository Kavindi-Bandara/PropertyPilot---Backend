spring.application.name=collab
server.port=8090

spring.datasource.url=jdbc:postgresql://localhost:5432/Property
spring.datasource.username=postgres
spring.datasource.password=Kavi&123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# JWT signing key (HS256, at least 32 characters). Override with the JWT_SECRET env var outside local dev.
app.jwt.secret=${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
app.jwt.expiration-minutes=1440

# Frontend origins allowed to call the API (comma-separated)
app.cors.allowed-origins=http://localhost:5173

# Optional: creates an ADMIN account on startup if the email doesn't exist yet
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.full-name=Administrator
